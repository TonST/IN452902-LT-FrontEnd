<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduHub Web - Sự kiện sắp diễn ra</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <h1 class="logo">EduHub<span>.</span></h1>
        <nav>
            <ul class="nav-links">
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#" class="active">Sự kiện</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="page-header">
            <h2>Sự kiện sắp diễn ra</h2>
        </section>

        <form id="search-form" class="search-form">
            <label for="keyword">Tìm kiếm sự kiện:</label>
            <div class="input-wrapper">
                <input type="search" id="keyword" placeholder="Nhập tên sự kiện...">
                <button type="submit">Tìm</button>
            </div>
        </form>

        <p id="status" class="status-msg"></p>

        <section id="event-list" class="event-grid">
            <article class="event-card">
                <figure>
                    <img src="img/event.svg" alt="Workshop Git & GitHub">
                </figure>
                <div class="card-info">
                    <h3><a href="event-detail.html?id=22222222-0000-0000-0000-000000000001">Workshop Git & GitHub cho tân sinh viên</a></h3>
                    <p class="time"><time datetime="2026-09-12T08:00:00+07:00">08:00, 12/09/2026</time></p>
                    <p class="location">Phòng máy A3.201</p>
                    <p class="seats">Còn 12/40 chỗ</p>
                </div>
            </article>

            <article class="event-card">
                <figure>
                    <img src="img/event.svg" alt="Hackathon EduHub 24 giờ">
                </figure>
                <div class="card-info">
                    <h3><a href="event-detail.html?id=22222222-0000-0000-0000-000000000002">Hackathon EduHub 24 giờ</a></h3>
                    <p class="time"><time datetime="2026-12-19T08:00:00+07:00">08:00, 19/12/2026</time></p>
                    <p class="location">Phòng máy A3.205</p>
                    <span class="badge-full">Hết chỗ</span>
                </div>
            </article>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 EduHub Web. Bản quyền thuộc về trường Đại học Đồng Tháp.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
